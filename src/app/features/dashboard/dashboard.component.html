<div class="dashboard">

  <h2 class="page-title">Dashboard</h2>

  <!-- Metric cards -->
  <div class="metrics-grid">
    @for (metric of metrics(); track metric.label) {
      <mat-card class="metric-card">
        <mat-card-content>
          <div class="metric-inner">
            <div class="metric-info">
              <span class="metric-label">{{ metric.label }}</span>
              <span class="metric-value">{{ metric.value }}</span>
            </div>
            <mat-icon class="metric-icon {{ metric.color }}">{{ metric.icon }}</mat-icon>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>

  <!-- Tabla de alertas recientes -->
  <mat-card class="table-card">
    <mat-card-header>
      <mat-card-title>Alertas recientes</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="alertas()" class="full-width">

        <ng-container matColumnDef="linea">
          <th mat-header-cell *matHeaderCellDef>Línea</th>
          <td mat-cell *matCellDef="let row">{{ row.linea }}</td>
        </ng-container>

        <ng-container matColumnDef="estacion">
          <th mat-header-cell *matHeaderCellDef>Estación</th>
          <td mat-cell *matCellDef="let row">{{ row.estacion }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let row">{{ row.tipo }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <!-- <mat-chip [class]="row.estado | estadoClass"> -->
             <mat-chip >
              {{ row.estado }}
            </mat-chip>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </mat-card-content>
  </mat-card>

</div>
