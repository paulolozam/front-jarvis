<div class="usuarios">

  <div class="page-header">
    <h2 class="page-title">Usuarios</h2>
    <button mat-flat-button color="primary" (click)="nuevoUsuario()">
      <mat-icon>person_add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  <mat-card>
    <mat-card-content>

      @if (loading()) {
        <div class="loading-container">
          <mat-spinner diameter="40" />
        </div>
      }

      @if (!loading()) {
        <table mat-table [dataSource]="usuarios()" class="full-width">

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let row">
              {{ row.first_name }} {{ row.last_name }}
              <span class="username">{{ '@' + row.username }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <ng-container matColumnDef="roles">
            <th mat-header-cell *matHeaderCellDef>Roles</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip-set>
                @for (role of row.roles; track role.id) {
                  <mat-chip>{{ role.role_name }}</mat-chip>
                }
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <span [class]="row.is_active ? 'badge active' : 'badge inactive'">
                {{ row.is_active ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button (click)="editarUsuario(row)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
      }

    </mat-card-content>
  </mat-card>

</div>
